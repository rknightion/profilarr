name: Sonarr - 1080p x265 Compact
description: "Sonarr profile optimized for 1080p x265 releases with streaming-friendly audio"
upgrade_allowed: true
min_format_score: 10
cutoff_format_score: 300
min_upgrade_format_score: 50
language: Original

qualities:
  - name: HDTV-1080p
    allowed: true
  - name: WEB 1080p
    allowed: true
    items:
      - WEBDL-1080p
      - WEBRip-1080p
  - name: BR-DISK
    allowed: true
  - name: Bluray-1080p
    allowed: true
  - name: Raw-HD
    allowed: true

format_scores:
  # Hard blocks (-10000)
  - name: LQ Release Title
    score: -10000
  - name: Unwanted Codecs BLOCK
    score: -10000
  - name: Line Mic Dubbed
    score: -10000
  - name: Bad Dual Groups
    score: -10000
  - name: LQ Groups
    score: -10000
  - name: "Language: Not English"
    score: -10000

  # Negative scores (avoid)
  - name: DV No Fallback P5 AVOID
    score: -200
  - name: TrueHD Atmos AVOID
    score: -75
  - name: Dubbed Audio Title
    score: -50
  - name: Lossless Audio AVOID
    score: -50
  - name: DTS All AVOID
    score: -50

  # Positive scores (preferred)
  - name: DD+ Atmos
    score: 100
  - name: x265 HEVC
    score: 100
  - name: 10-bit
    score: 50
  - name: DV HDR10 Compatible
    score: 50
  - name: Trusted Movie Groups
    score: 25
  - name: Trusted TV Groups
    score: 25
  - name: PROPER REPACK
    score: 25
  - name: HDR10Plus
    score: 25
  - name: DDP 5.1
    score: 25
  - name: HDR10
    score: 15
