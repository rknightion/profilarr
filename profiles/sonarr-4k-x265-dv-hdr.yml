name: Sonarr - 4K x265 DV HDR
description: "Sonarr profile optimized for 4K x265 releases with Dolby Vision and HDR"
upgrade_allowed: true
min_format_score: 10
cutoff_format_score: 500
min_upgrade_format_score: 50
language: Original

qualities:
  - name: HDTV-2160p
    allowed: true
  - name: Raw-HD
    allowed: true
  - name: BR-DISK
    allowed: true
  - name: WEB 2160p
    allowed: true
    items:
      - WEBDL-2160p
      - WEBRip-2160p
  - name: Bluray-2160p
    allowed: true
  - name: Bluray-2160p Remux
    allowed: true

format_scores:
  # Hard blocks (-10000)
  - name: LQ Release Title
    score: -10000
  - name: Unwanted Codecs BLOCK
    score: -10000
  - name: Line Mic Dubbed
    score: -10000
  - name: Bad Dual Groups
    score: -10000
  - name: LQ Groups
    score: -10000
  - name: "Language: Not English"
    score: -10000

  # Negative scores (avoid)
  - name: Dubbed Audio Title
    score: -200
  - name: DV No Fallback P5 AVOID
    score: -200
  - name: Lossless Audio AVOID
    score: -100
  - name: DTS All AVOID
    score: -100
  - name: TrueHD Atmos AVOID
    score: -100

  # Positive scores (preferred)
  - name: DV HDR10 Compatible
    score: 200
  - name: x265 HEVC
    score: 150
  - name: HDR10Plus
    score: 100
  - name: DD+ Atmos
    score: 100
  - name: HDR10
    score: 75
  - name: Trusted Movie Groups
    score: 50
  - name: Trusted TV Groups
    score: 50
  - name: 10-bit
    score: 25
  - name: PROPER REPACK
    score: 25
  - name: DDP 5.1
    score: 25
  - name: 5.1 Surround
    score: 10
