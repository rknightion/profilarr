name: HDR10
description: "HDR10 custom format with 3 conditions"
tags:
  - HDR
conditions:
  - name: HDR10
    type: release_title
    pattern: "(?i)\bhdr10?\b"
    required: true
  - name: Not HDR10Plus
    type: release_title
    pattern: "(?i)(hdr10\+|hdr10plus)"
    negate: true
    required: true
  - name: Not DV
    type: release_title
    pattern: "(?i)\b(dv|dovi|dolby.?vision)\b"
    negate: true
    required: true
tests: []
