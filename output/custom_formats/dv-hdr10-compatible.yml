name: DV HDR10 Compatible
description: "DV HDR10 Compatible custom format with 2 conditions"
tags:
  - HDR
conditions:
  - name: Dolby Vision
    type: release_title
    pattern: "(?i)\b(dv|dovi|dolby.?vision)\b"
    required: true
  - name: HDR10 Fallback
    type: release_title
    pattern: "(?i)\bhdr(10)?\b"
    required: true
tests: []
