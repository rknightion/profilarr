name: Unwanted Codecs BLOCK
description: "Blocks unwanted video codecs including x264, AV1, XviD, etc."
tags:
  - Codec
  - Unwanted
conditions:
  - name: x264
    type: release_title
    pattern: "(?i)\b(x264|h\.?264|avc)\b"
    negate: false
    required: false
  - name: xvid
    type: release_title
    pattern: "(?i)\b(xvid)\b"
    negate: false
    required: false
  - name: divx
    type: release_title
    pattern: "(?i)\b(divx)\b"
    negate: false
    required: false
  - name: AV1
    type: release_title
    pattern: "(?i)\b(AV1)\b"
    negate: false
    required: false
  - name: VC-1
    type: release_title
    pattern: "(?i)\b(VC-?1)\b"
    negate: false
    required: false
  - name: WMV
    type: release_title
    pattern: "(?i)\b(WMV)\b"
    negate: false
    required: false
  - name: MPEG-2
    type: release_title
    pattern: "(?i)\b(MPEG-?2)\b"
    negate: false
    required: false
tests: []
