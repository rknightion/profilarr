name: HDR10
description: "Matches HDR10 releases (excludes HDR10+ and DV)"
tags:
  - HDR
conditions:
  - name: HDR10
    type: release_title
    pattern: "(?i)\bhdr10?\b"
    negate: false
    required: true
  - name: Not HDR10Plus
    type: release_title
    pattern: "(?i)(hdr10\+|hdr10plus)"
    negate: true
    required: true
  - name: Not DV
    type: release_title
    pattern: "(?i)\b(dv|dovi|dolby.?vision)\b"
    negate: true
    required: true
tests: []
