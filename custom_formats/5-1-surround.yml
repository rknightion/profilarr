name: 5.1 Surround
description: "Matches 5.1 surround sound releases (excludes DDP and Atmos)"
tags:
  - Audio
conditions:
  - name: 5.1 Audio
    type: release_title
    pattern: "(?i)(5\.?1|6ch)"
    negate: false
    required: true
  - name: Not DDP
    type: release_title
    pattern: "(?i)(ddp|dd\+|eac3)"
    negate: true
    required: true
  - name: Not Atmos
    type: release_title
    pattern: "(?i)\batmos\b"
    negate: true
    required: true
tests: []
