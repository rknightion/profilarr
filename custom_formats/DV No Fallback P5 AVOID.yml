name: DV No Fallback P5 AVOID
description: "Matches Dolby Vision Profile 5 releases without HDR10 fallback - avoid for compatibility"
tags:
  - HDR
  - Unwanted
conditions:
  - name: Has Dolby Vision
    type: release_title
    pattern: "(?i)\\b(dv|dovi|dolby.?vision)\\b"
    negate: false
    required: true
  - name: No HDR Mentioned
    type: release_title
    pattern: "(?i)\\bhdr"
    negate: true
    required: true
tests: []
