name: TrueHD Atmos
pattern: '(?i)\b(TrueHD[. ]?Atmos|Atmos[. ]?TrueHD)\b'
description: "Matches TrueHD Atmos lossless releases"
tags:
  - Audio
  - Lossless
  - Enhancement
tests:
- id: 1
  input: Movie.2024.2160p.UHD.BluRay.TrueHD.Atmos.7.1.x265-GROUP
  expected: true
- id: 2
  input: Movie.2024.2160p.UHD.BluRay.TrueHD.7.1.Atmos.x265-GROUP
  expected: true
- id: 3
  input: Movie.2024.2160p.UHD.BluRay.Atmos.TrueHD.x265-GROUP
  expected: true
- id: 4
  input: Movie.2024.1080p.WEB-DL.DDP.Atmos.x265-GROUP
  expected: false
- id: 5
  input: Movie.2024.2160p.UHD.BluRay.TrueHD.7.1.x265-GROUP
  expected: false
