name: Atmos
pattern: '(?i)\batmos\b'
description: "Matches any Atmos audio release"
tags:
  - Audio
  - Enhancement
tests:
- id: 1
  input: Movie.2024.1080p.WEB-DL.DDP5.1.Atmos.x265-GROUP
  expected: true
- id: 2
  input: Movie.2024.2160p.UHD.BluRay.TrueHD.Atmos.7.1.x265-GROUP
  expected: true
- id: 3
  input: Movie.2024.1080p.WEB-DL.ATMOS.x265-GROUP
  expected: true
- id: 4
  input: Movie.2024.1080p.WEB-DL.DDP5.1.x265-GROUP
  expected: false
- id: 5
  input: Movie.2024.1080p.WEB-DL.TrueHD.x265-GROUP
  expected: false
