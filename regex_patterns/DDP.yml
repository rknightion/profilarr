name: DDP
pattern: '(?i)(ddp|dd\+|eac3)'
description: "Matches Dolby Digital Plus releases"
tags:
  - Audio
tests:
- id: 1
  input: Movie.2024.1080p.WEB-DL.DDP5.1.x265-GROUP
  expected: true
- id: 2
  input: Movie.2024.1080p.WEB-DL.DD+5.1.x265-GROUP
  expected: true
- id: 3
  input: Movie.2024.1080p.WEB-DL.EAC3.5.1.x265-GROUP
  expected: true
- id: 4
  input: Movie.2024.1080p.WEB-DL.DDP.Atmos.x265-GROUP
  expected: true
- id: 5
  input: Movie.2024.1080p.WEB-DL.AC3.x265-GROUP
  expected: false
- id: 6
  input: Movie.2024.1080p.WEB-DL.TrueHD.x265-GROUP
  expected: false
