name: HDR Any
pattern: '(?i)\bhdr\b'
description: "Matches any HDR release"
tags:
  - HDR
tests:
- id: 1
  input: Poison.2023.HDR.2160p.WEB.h265-BETTY
  expected: true
- id: 2
  input: Movie.2024.2160p.WEB.HDR10.x265-GROUP
  expected: true
- id: 3
  input: Movie.2024.2160p.WEB.HDR10Plus.x265-GROUP
  expected: true
- id: 4
  input: Movie.2024.2160p.WEB.hdr.x265-GROUP
  expected: true
- id: 5
  input: Movie.2024.1080p.WEB-DL.x265-GROUP
  expected: false
- id: 6
  input: Movie.2024.2160p.WEB.DV.x265-GROUP
  expected: false
