name: 10-bit
pattern: '(?i)\b(10[._\- ]?bit|hi10p)\b'
description: "Matches 10-bit color depth releases"
tags:
  - Codec
  - Enhancement
tests:
- id: 1
  input: Futurama.-.Benders.Big.Score.2007.1080p.Webrip.x265.10bit.AC3.5.1-Goki
  expected: true
- id: 2
  input: Movie.2024.1080p.WEB.x265.10-bit-GROUP
  expected: true
- id: 3
  input: Movie.2024.1080p.WEB.x265.10.bit-GROUP
  expected: true
- id: 4
  input: Movie.2024.1080p.WEB.x265.10_bit-GROUP
  expected: true
- id: 5
  input: Movie.2024.1080p.WEB.x265.Hi10P-GROUP
  expected: true
- id: 6
  input: Movie.2024.1080p.WEB.x265-GROUP
  expected: false
- id: 7
  input: Movie.2024.1080p.WEB.x265.8bit-GROUP
  expected: false
